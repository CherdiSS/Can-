<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover нужен, чтобы на iPhone работали safe-area-inset -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="format-detection" content="telephone=no">
  <title>Неоновый Побег</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Сюда Phaser вставит canvas с игрой (HUD + арена) -->
  <div id="game-container"></div>

  <!-- Нижняя панель управления: своё место на экране, не поверх арены -->
  <div id="control-panel">
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
  </div>

  <!-- Подсказка для горизонтальной ориентации телефона -->
  <div id="rotate-notice">Поверните телефон вертикально</div>

  <!-- Phaser 3 подключаем через CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Порядок важен: сначала настройки и утилиты, затем объекты, сцены и запуск -->
  <script src="js/config.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/joystick.js"></script>
  <script src="js/objects/Player.js"></script>
  <script src="js/objects/Chaser.js"></script>
  <script src="js/objects/Bonus.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/UIScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

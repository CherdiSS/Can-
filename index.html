<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover нужен, чтобы на iPhone работали safe-area-inset -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e242c">
  <!-- Запуск с экрана «Домой»: без адресной строки, статус-бар поверх игры (отступы — safe-area) -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="СПИДозный ЦГБ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <meta name="format-detection" content="telephone=no">
  <title>СПИДозный ЦГБ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Сюда Phaser вставит canvas с игрой (арена). Кнопка паузы — в правом верхнем углу поля -->
  <div id="game-container">
    <button id="pause-button" class="hud" type="button" aria-label="Пауза"><span></span><span></span></button>
  </div>

  <!-- Нижняя панель управления: своё место на экране, не поверх арены.
       Слева — счёт и таймер, по центру — джойстик, справа — пауза. -->
  <div id="control-panel">
    <div id="hud-left" class="hud">
      <div id="hud-score">0</div>
      <div id="hud-time">0:00</div>
      <div id="hud-combo"><span id="hud-combo-text"></span><div id="hud-combo-bar"></div></div>
    </div>
    <div id="joystick-base">
      <div id="joystick-knob"></div>
    </div>
    <div id="hud-right" class="hud">
      <button id="dodge-button" type="button" aria-label="Уворот"><span id="dodge-label">УВОРОТ</span><div id="dodge-cooldown"></div></button>
    </div>
  </div>

  <!-- Подсказка для горизонтальной ориентации телефона -->
  <div id="rotate-notice">Поверните телефон вертикально</div>

  <!-- Phaser 3 подключаем через CDN -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>

  <!-- Порядок важен: сначала настройки и утилиты, затем объекты, сцены и запуск -->
  <script src="js/config.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/sound.js"></script>
  <script src="js/utils/joystick.js"></script>
  <script src="js/utils/hud.js"></script>
  <script src="js/objects/Player.js"></script>
  <script src="js/objects/Chaser.js"></script>
  <script src="js/objects/Bonus.js"></script>
  <script src="js/objects/Npc.js"></script>
  <script src="js/scenes/BootScene.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>
  <script src="js/scenes/UIScene.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
